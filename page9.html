<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>can I ask you something</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .pulse{
    position:fixed; top:50%; left:50%; width:10px; height:10px; border-radius:50%;
    background: var(--accent); transform:translate(-50%,-50%);
    box-shadow: 0 0 40px 12px color-mix(in srgb, var(--accent) 55%, transparent);
    animation: heartbeat 2.4s ease-in-out infinite; z-index:1;
  }
  @keyframes heartbeat{
    0%,100%{ transform: translate(-50%,-50%) scale(1); }
    18%{ transform: translate(-50%,-50%) scale(1.35); }
    32%{ transform: translate(-50%,-50%) scale(1); }
    46%{ transform: translate(-50%,-50%) scale(1.2); }
  }

  .question-card{
    position:relative; z-index:3; width:min(92vw, 420px); background: rgba(13,14,18,.65);
    border:1px solid rgba(255,255,255,.1); border-radius:24px; padding: 1.4rem 1.2rem 1.1rem;
    box-shadow: 0 18px 44px rgba(0,0,0,.22);
  }
  .question-card h1{
    font-family: var(--font-display); font-weight:400; font-size: clamp(1.7rem, 5vw, 2.6rem);
    line-height:1.12; margin-bottom: .9rem;
  }
  .question-card textarea{
    width:100%; min-height: 110px; resize: vertical; border-radius: 16px; border:1px solid rgba(255,255,255,.15);
    background: rgba(255,255,255,.04); color: var(--ink); padding: .9rem 1rem; font: inherit; line-height:1.5;
  }
  .question-card textarea:focus{ outline:2px solid rgba(147,168,255,.8); outline-offset:2px; }
  .card-actions{ display:flex; flex-direction:column; gap: .8rem; margin-top: 1rem; }
  .answer-status{
    min-height: 1.4em; color: var(--accent-2); font-size:.82rem; letter-spacing:.02em; opacity:0;
    transition: opacity 350ms ease;
  }
  .answer-status.is-visible{ opacity:1; }
  .continue-wrap{ margin-top: 1.4rem; }

  @media (max-width: 430px){
    .scene{ padding-inline: 5vw; }
    .question-card{ padding: 1.1rem .9rem .9rem; }
    .card-actions .btn{ width:100%; justify-content:center; }
  }
</style>
</head>
<body class="tone-dark">
  <div class="grain"></div>
  <button class="sound-toggle" aria-label="Play music"></button>
  <div class="progress" data-page="4"></div>
  <div class="pulse" id="pulse"></div>

  <main class="scene">
    <div class="question-card">
      <h1>anh mong là anh với em sẽ có thể đón thêm nhiều sinh nhật cùng nhau như thế này nữa. Em đang muốn ước gì nè?</h1>
      <form id="answerForm">
        <textarea id="answerInput" maxlength="400" placeholder="em ước ở đây nhe"></textarea>
        <div class="card-actions">
          <button type="submit" class="btn">để anh thực hiện cho</button>
          <p class="answer-status" id="answerStatus"></p>
        </div>
      </form>
      <div class="continue-wrap">
        <a href="page10.html" class="btn" data-go="page10.html">còn cái cuối nữa á</a>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script>
    const form = document.getElementById('answerForm');
    const input = document.getElementById('answerInput');
    const status = document.getElementById('answerStatus');
    const saved = localStorage.getItem('birthday-answer');

    if (saved) {
      input.value = saved;
      status.textContent = 'saved answer: ' + saved;
      status.classList.add('is-visible');
    }

    form.addEventListener('submit', function (event) {
      event.preventDefault();
      const value = input.value.trim();

      if (!value) {
        status.textContent = 'Your answer matters too — just a few words is enough.';
        status.classList.add('is-visible');
        input.focus();
        return;
      }

      localStorage.setItem('birthday-answer', value);
      status.textContent = 'Saved. Thank you for answering.';
      status.classList.add('is-visible');
    });
  </script>
</body>
</html>
