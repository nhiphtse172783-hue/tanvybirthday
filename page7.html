<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>our months</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body.tone-paper {
    background: #e2bccb;
  }

  .scene {
    height: 100vh;
    height: 100dvh;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    overflow: hidden;
  }

  .photo-board {
    display: block;
    width: auto;
    height: 100vh;
    height: 100dvh;
    max-width: 100vw;
    max-height: 100dvh;
    object-fit: contain;
    object-position: center center;
    background: linear-gradient(180deg, #f6efe7 0%, #efe4d8 100%);
    filter: none;
    user-select: none;
    pointer-events: none;
  }

  .next-btn {
    position: fixed;
    right: 24px;
    bottom: 28px;
    z-index: 20;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 0.8rem 1.3rem;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(92, 69, 76, 0.25);
    color: #3f2d34;
    font-size: 0.82rem;
    letter-spacing: 0.02em;
    text-transform: none;
    text-decoration: none;
    backdrop-filter: blur(4px);
    box-shadow: 0 10px 20px rgba(80, 58, 64, 0.08);
  }

  @media (max-width: 430px) {
    .scene {
      align-items: center;
      justify-content: center;
    }

    .photo-board {
      width: 100vw;
      height: auto;
      max-height: 100dvh;
      object-fit: contain;
      object-position: center center;
    }

    .next-btn {
      right: 18px;
      bottom: 18px;
      padding: 0.72rem 1.1rem;
      font-size: 0.72rem;
      letter-spacing: 0.02em;
    }
  }
</style>
</head>
<body class="tone-paper">
  <div class="grain"></div>

  <main class="scene">
    <img src="assets/images/page7.png" alt="Memory board" class="photo-board">
    <a href="page9.html" class="next-btn">tiếp theo nào</a>
  </main>
</body>
</html>
